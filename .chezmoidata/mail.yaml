# Mail accounts, labels and mirrored lists (see docs/mail/)
#
# Rendered into ~/.mbsyncrc, ~/.config/nntp-sync/groups and the neomutt
# mailboxes and hooks, so a label or a group is added in one place.
# Each account has its IMAP login address and either the mail-secret name
# of its app password or `oauth2: true` (the token comes from
# mail-oauth2, for accounts that allow no app password).  Labels keep
# their Gmail names verbatim and are synced to ~/Mail/<account>/<label>;
# the labels also listed in `flat` are shown in neomutt without threads.
# Groups go to ~/Mail/lists/<name>.
mail:
  accounts:
    - name: personal
      title: Personal
      login: rbgarga@gmail.com
      secret: personal
      labels:
        - Servers/Galle
    - name: freebsd
      title: FreeBSD
      login: garga.bsd@gmail.com
      secret: freebsd-gmail
      # Sent through smtp.FreeBSD.org, which keeps no copy in Gmail:
      # neomutt records sent mail in ~/Mail/freebsd/sent
      sent_copy: true
      labels:
        - freebsd/MFC
        - freebsd/bugs
        - freebsd/developers
        - freebsd/git
        - freebsd/ports-developers
        - freebsd/reviews
        - git/announce
        - git/security
        - github
        - sudo/workers
    - name: work
      title: Work
      login: garga@netgate.com
      # Netgate's Workspace allows no app passwords
      oauth2: true
      labels:
        - gitlab
        - jenkins
        - redmine
        - lists/ng-eng-staff
        - lists/pfsense-gitlab
        - lists/tnsr-dev
        - lists/tnsr-git
        - lists/tnsr-gitlab
        - lists/vpp-dev
      # One notification per message, nothing to thread
      flat:
        - jenkins

  # gmane group, list name (the local folder) and the days of history
  # kept: the first run of a group fetches that many days, and mail-sync
  # removes the messages that grow older (flagged ones stay).  After
  # raising days, `nntp-sync --backfill <name> <days>` fetches the older
  # history.  An optional title replaces the name in neomutt's sidebar.
  # Optional skip is a Perl regex without blanks (use \s) or #: the
  # articles whose Subject matches it, case-insensitively, are neither
  # fetched nor stored.  With read: true every article is delivered
  # read, for the lists kept only to be searched.
  groups:
    # FreeBSD discussion and announcements
    - { group: gmane.os.freebsd.announce, name: freebsd-announce, days: 360 }
    - { group: gmane.os.freebsd.architechture, name: freebsd-arch, days: 360 }
    - { group: gmane.os.freebsd.current, name: freebsd-current, days: 360 }
    - { group: gmane.os.freebsd.stable, name: freebsd-stable, days: 360 }
    - { group: gmane.os.freebsd.devel.acpi, name: freebsd-acpi, days: 360 }
    - { group: gmane.os.freebsd.devel.hackers, name: freebsd-hackers, days: 360 }
    - { group: gmane.os.freebsd.devel.pkgbase, name: freebsd-pkgbase, days: 360 }
    - { group: gmane.os.freebsd.devel.ports, name: freebsd-ports, days: 360 }
    - { group: gmane.os.freebsd.devel.wireless, name: freebsd-wireless, days: 360 }
    # FreeBSD commit lists, high volume: a few weeks only
    - { group: gmane.os.freebsd.devel.cvs.ports, name: dev-commits-ports-all, title: commits-ports, days: 30 }
    - { group: gmane.os.freebsd.devel.cvs.src, name: dev-commits-src-all, title: commits-src, days: 60, skip: '^git:\s\w+\s-\sstable/' }
    # Other projects
    - { group: gmane.comp.version-control.git, name: git, days: 360, read: true }
    - { group: gmane.comp.tools.sudo.announce, name: sudo-announce, days: 360 }
    - { group: gmane.comp.tools.sudo.devel, name: sudo-workers, days: 360 }
    - { group: gmane.comp.web.curl.announce, name: curl-announce, days: 360 }
    - { group: gmane.linux.kernel.announce, name: linux-kernel-announce, days: 360 }
    - { group: gmane.linux.ubuntu.announce, name: ubuntu-announce, days: 360 }
