set -g bell-action any
set -g visual-bell off
set -g default-terminal tmux-256color

set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

set-option -g focus-events on
set-option -sg escape-time 10

set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -as terminal-overrides ",*:RGB"

# Allow clipboard with OSC-52 work
set -s set-clipboard on

#### COLOUR (Gruvbox Dark)

# default statusbar colors
set-option -g status-style fg=#fabd2f,bg=#282828 #bright yellow on dark0

# default window title colors
set-window-option -g window-status-style fg=#a89984,bg=default #light4

# active window title colors
set-window-option -g window-status-current-style fg=#fe8019,bg=default #bright orange

# pane border
set-option -g pane-border-style fg=#3c3836 #dark1
set-option -g pane-active-border-style fg=#665c54 #dark3

# message text
set-option -g message-style fg=#fe8019,bg=#282828 #bright orange on dark0

# pane number display
set-option -g display-panes-active-colour "#83a598" #bright blue
set-option -g display-panes-colour "#fe8019" #bright orange

# clock
set-window-option -g clock-mode-colour "#b8bb26" #bright green

# bell
set-window-option -g window-status-bell-style fg=#282828,bg=#fb4934 #dark0, red

# Cmd+PgUp/PgDn arrives as Alt+PgUp/PgDn (forwarded by ghostty) and scrolls
# the history of the focused pane; nvim keeps plain PgUp/PgDn
bind -n M-PageUp if-shell -F '#{pane_in_mode}' 'send -X page-up' 'copy-mode -e \; send -X page-up'
bind -n M-PageDown if-shell -F '#{pane_in_mode}' 'send -X page-down'

# Adjust terminal title
set -g set-titles on
set -g set-titles-string "#{user}@#h: #{s|$HOME|~|:pane_current_path} (#{pane_current_command})"

# Refresh window title every second
set -g status-interval 1
