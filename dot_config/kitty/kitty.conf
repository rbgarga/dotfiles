# kitty - the terminal of neomutt alone, so it is an application of its
# own in the Dock and Cmd-Tab (macOS has no per-window class to set).
# Opened, or brought to the front, by the Raycast Neomutt command; the
# look follows ghostty/config.

# --- neomutt --------------------------------------------------------
# Each start opens neomutt, through an interactive zsh for PATH and the
# tty settings, and quitting it quits kitty
startup_session neomutt.session
macos_quit_when_last_window_closed yes
confirm_os_window_close 0
allow_remote_control no
shell_integration disabled

# --- Window ---------------------------------------------------------
# Size and position of the last window, or 116x27 on the first start
remember_window_size yes
remember_window_position yes
initial_window_width 116c
initial_window_height 27c
window_padding_width 2
background_opacity 0.95
background_blur 20

# --- Font -----------------------------------------------------------
font_family MesloLGMDZ Nerd Font Mono
font_size 18
disable_ligatures always

# --- Gruvbox dark ---------------------------------------------------
foreground #ebdbb2
background #282828
cursor #ebdbb2
cursor_text_color #282828
selection_foreground #ebdbb2
selection_background #665c54
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# --- Input and clipboard --------------------------------------------
macos_option_as_alt yes
mouse_hide_wait -1
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
strip_trailing_spaces smart
